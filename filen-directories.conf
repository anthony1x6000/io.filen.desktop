# ==============================================================================
# Filen Desktop Flatpak - Directory Configuration
# ==============================================================================
# This configuration file defines default and allowed directories for
# synchronization, temporary caching, and virtual drive mounts.
#
# Locations:
#   - System default template: /app/etc/filen-directories.conf
#   - User override location:   ~/.config/filen/directories.conf
#
# Note: For directories outside the user's home folder or standard XDG paths,
# additional Flatpak sandbox permissions can be granted via Flatpak overrides:
#   flatpak override --user --filesystem=/path/to/directory io.filen.desktop
# ==============================================================================

# Primary synchronization root directory.
# By default, only ~/Downloads is accessible within the Flatpak sandbox.
# Environment variables like $HOME are expanded automatically.
FILEN_SYNC_ROOT="$HOME/Downloads/Filen"

# Additional explicitly permitted directories for selective folder synchronization.
# To grant access to additional folders, use Flatseal or 'flatpak override'.
# Paths should be colon-separated (:).
FILEN_ALLOWED_DIRS="$HOME/Downloads"

# Whether to automatically create the sync root directory if it does not exist (true/false)
FILEN_AUTO_CREATE_SYNC_ROOT=true

# Custom cache directory location (defaults to XDG_CACHE_HOME/filen inside app sandbox)
FILEN_CACHE_DIR="$HOME/.var/app/io.filen.desktop/cache"

# Virtual Drive Mount Point (FUSE / WebDAV mount path)
FILEN_MOUNT_POINT="$HOME/Downloads/FilenDrive"

# Strict directory isolation mode (true/false)
# When set to true, filen.sh will log warnings if syncing is attempted outside
# the permitted list above.
FILEN_STRICT_DIRECTORY_CHECK=false
