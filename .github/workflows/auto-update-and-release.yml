name: Auto Update & Release

on:
  schedule:
    - cron: '0 0 * * *' # Check daily at midnight UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Exercise the real checker and build without pushing, tagging or releasing'
        type: boolean
        default: false

permissions:
  contents: write
  # Needed to dispatch the build/deploy workflow and follow its run.
  actions: write
  # Needed to keep the pipeline failure issue open.
  issues: write

# Two runs tagging the same release would race each other, so a scheduled run
# and a manual one queue instead of overlapping.
concurrency:
  group: auto-update-and-release
  cancel-in-progress: false

jobs:
  update-and-release:
    name: Update, Build & Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Upstream, Build & Release
        run: bash scripts/actions/auto-update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          AUTO_UPDATE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      # Nobody watches the Actions tab here, so a failing pipeline leaves an
      # issue behind instead of a red run somebody has to notice.
      - name: Report Pipeline Outcome
        if: always() && job.status != 'cancelled'
        run: bash scripts/actions/report-pipeline-outcome.sh "${{ job.status }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
