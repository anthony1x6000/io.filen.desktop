name: Auto Update & Release

on:
  schedule:
    - cron: '0 0 * * *' # Check daily at midnight UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Exercise the checker and build any update without publishing'
        type: boolean
        default: false

permissions:
  contents: write
  # Needed to dispatch the build/deploy workflow and follow its run.
  actions: write
  # Needed to keep the pipeline failure issue open.
  issues: write

# Two runs tagging the same release would race each other, so a scheduled run
# and a manual one queue instead of overlapping.
concurrency:
  group: auto-update-and-release
  cancel-in-progress: false

jobs:
  update-and-release:
    name: Update, Build & Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Upstream, Build & Release
        run: bash scripts/actions/auto-update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          REQUIRE_SIGNING: '1'
          AUTO_UPDATE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

  # Nobody watches the Actions tab here. A separate lightweight job still runs
  # when the updater's container or checkout fails before its script exists.
  report-outcome:
    name: Report Pipeline Outcome
    needs: update-and-release
    if: always() && !inputs.dry_run && needs.update-and-release.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report Pipeline Outcome
        # Fetch the reporter from the pinned commit instead of checking out the
        # repository, so a checkout failure cannot take reporting down too.
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/actions/report-pipeline-outcome.sh?ref=$GITHUB_SHA" --jq .content \
            | base64 --decode \
            | bash -s -- "${{ needs.update-and-release.result }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
