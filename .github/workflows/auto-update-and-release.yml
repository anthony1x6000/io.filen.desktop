name: Auto Update & Release

on:
  schedule:
    - cron: '0 0 * * *' # Check daily at midnight UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Exercise the real checker and build without pushing, tagging or releasing'
        type: boolean
        default: false

permissions:
  contents: write
  # Needed to dispatch the build/deploy workflow for the released commit.
  actions: write

jobs:
  update-and-release:
    name: Update, Build & Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Upstream, Build & Release
        run: bash scripts/actions/auto-update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          AUTO_UPDATE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
