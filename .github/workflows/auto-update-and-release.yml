name: Auto Update & Release

on:
  schedule:
    - cron: '0 */6 * * *' # Check every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-release:
    name: Update, Build & Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust Workspace Directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install flatpak-external-data-checker
        shell: bash
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.flathub.flatpak-external-data-checker

      - name: Check for Updates & Update Manifest
        id: update
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flatpak run --env=GITHUB_TOKEN=$GITHUB_TOKEN --filesystem=$(pwd) org.flathub.flatpak-external-data-checker --update io.filen.desktop.yaml
          
          if [[ -n "$(git status --porcelain io.filen.desktop.yaml)" ]]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            
            # Extract new version from the URL in the yaml
            VERSION=$(grep -oP 'releases/download/v\K[^/]+' io.filen.desktop.yaml | head -n 1)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Found new version: $VERSION"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "No updates found."
          fi

      - name: Update metainfo.xml (Optional)
        if: steps.update.outputs.has_update == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          python3 - << EOF
          import xml.etree.ElementTree as ET
          import sys

          version = "${VERSION}"
          date = "${DATE}"

          tree = ET.parse('io.filen.desktop.metainfo.xml')
          root = tree.getroot()
          releases = root.find('releases')
          if releases is not None:
              for r in releases.findall('release'):
                  if r.get('version') == version:
                      sys.exit(0)
              
              new_release = ET.Element('release', {'version': version, 'date': date})
              desc = ET.SubElement(new_release, 'description')
              p = ET.SubElement(desc, 'p')
              p.text = f'Automatic update to version {version}'
              
              releases.insert(0, new_release)
              ET.indent(tree, space='  ', level=0)
              tree.write('io.filen.desktop.metainfo.xml', encoding='utf-8', xml_declaration=True)
          EOF

      - name: Build Flatpak
        if: steps.update.outputs.has_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo
          ostree init --mode=archive --repo=repo
          ostree config --repo=repo set "core.min-free-space-percent" "0"
          ostree config --repo=repo set "core.min-free-space-size" "0MB"

          flatpak-builder \
            --repo=repo \
            --force-clean \
            --disable-cache \
            --install-deps-from=flathub \
            --arch=x86_64 \
            --default-branch=master \
            --disable-rofiles-fuse \
            build-dir \
            io.filen.desktop.yaml

          flatpak build-update-repo --generate-static-deltas repo

          flatpak build-bundle repo io.filen.desktop.flatpak io.filen.desktop \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --repo-url=https://anthony1x6000.github.io/io.filen.desktop/repo

      - name: Commit, Tag & Release
        if: steps.update.outputs.has_update == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.update.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Anthony"
          git config user.email "33004321+anthony1x6000@users.noreply.github.com"
          
          git add io.filen.desktop.yaml io.filen.desktop.metainfo.xml
          
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing to commit."
            exit 0
          fi
          
          git commit -m "chore(release): auto-update to v$VERSION" \
            -m "Co-authored-by: Antigravity Assistant <assistant@deepmind.google>"
          
          # Push to the branch (main)
          git push origin HEAD:main
          
          # Create and push the tag
          TAG="v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"
          
          # Create the GitHub Release and attach the flatpak
          gh release create "$TAG" io.filen.desktop.flatpak \
            --title "$TAG" \
            --generate-notes
