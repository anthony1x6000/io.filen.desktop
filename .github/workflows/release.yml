name: Release Flatpak Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default deny all token permissions
permissions: {}

jobs:
  release:
    name: Build & Release Flatpak Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: io.filen.desktop.flatpak
          manifest-path: io.filen.desktop.yaml
          arch: x86_64
          run-tests: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: io.filen.desktop.flatpak
          draft: false
          prerelease: false
          generate_release_notes: true
