name: Release Flatpak Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default deny all token permissions
permissions: {}

jobs:
  release:
    name: Build & Release Flatpak Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@abe38226c89648d396ba7164448cfe161979615b # v6.4
        with:
          bundle: io.filen.desktop.flatpak
          manifest-path: io.filen.desktop.yaml
          arch: x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: io.filen.desktop.flatpak
          draft: false
          prerelease: false
          generate_release_notes: true
