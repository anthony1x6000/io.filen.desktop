name: Build & Validate Flatpak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Default deny all token permissions
permissions: {}

jobs:
  validate:
    name: Validate Metadata & Upstream Hashes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Validation Tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils appstream-util python3

      - name: Validate Desktop File
        shell: bash
        run: |
          set -euo pipefail
          desktop-file-validate io.filen.desktop.desktop

      - name: Validate AppStream Metainfo
        shell: bash
        run: |
          set -euo pipefail
          appstream-util validate-relax --nonet io.filen.desktop.metainfo.xml
          appstreamcli validate --no-net io.filen.desktop.metainfo.xml

      - name: Verify Upstream Release Checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import re, urllib.request, sys

          with open("io.filen.desktop.yaml", "r", encoding="utf-8") as f:
              manifest = f.read()

          # Match the exact sha256 within the extra-data blocks for deb releases
          amd64_manifest = re.search(r"Filen_linux_amd64\.deb\n\s+sha256:\s+([0-9a-fA-F]{64})", manifest)
          arm64_manifest = re.search(r"Filen_linux_arm64\.deb\n\s+sha256:\s+([0-9a-fA-F]{64})", manifest)

          if not amd64_manifest or not arm64_manifest:
              print("::error::Could not extract deb sha256 checksums from manifest!")
              sys.exit(1)

          manifest_amd64 = amd64_manifest.group(1).lower()
          manifest_arm64 = arm64_manifest.group(1).lower()

          version_match = re.search(r"v(\d+\.\d+\.\d+)/Filen_linux_amd64\.deb", manifest)
          version = version_match.group(1) if version_match else "3.0.53"

          print(f"=== Verifying Release v{version} Hashes ===")
          amd64_url = f"https://github.com/FilenCloudDienste/filen-desktop/releases/download/v{version}/Filen_linux_amd64.deb.sha256.txt"
          arm64_url = f"https://github.com/FilenCloudDienste/filen-desktop/releases/download/v{version}/Filen_linux_arm64.deb.sha256.txt"

          upstream_amd64 = urllib.request.urlopen(amd64_url, timeout=30).read().decode().strip().split()[0].lower()
          upstream_arm64 = urllib.request.urlopen(arm64_url, timeout=30).read().decode().strip().split()[0].lower()

          print(f"AMD64 Manifest Hash: {manifest_amd64}")
          print(f"AMD64 Upstream Hash: {upstream_amd64}")
          if manifest_amd64 != upstream_amd64:
              print(f"::error::AMD64 hash mismatch: expected {upstream_amd64}, found {manifest_amd64}")
              sys.exit(1)

          print(f"ARM64 Manifest Hash: {manifest_arm64}")
          print(f"ARM64 Upstream Hash: {upstream_arm64}")
          if manifest_arm64 != upstream_arm64:
              print(f"::error::ARM64 hash mismatch: expected {upstream_arm64}, found {manifest_arm64}")
              sys.exit(1)

          print("✓ All release checksums verified successfully!")
          EOF

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: io.filen.desktop-${{ matrix.arch }}.flatpak
          manifest-path: io.filen.desktop.yaml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          run-tests: false

      - name: Upload Flatpak Bundle Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: io.filen.desktop-${{ matrix.arch }}.flatpak
          path: io.filen.desktop-${{ matrix.arch }}.flatpak
          retention-days: 14
