name: Build & Validate Flatpak

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'README.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'README.md'
  workflow_dispatch:

# Default deny all token permissions
permissions: {}

jobs:
  validate:
    name: Validate Metadata & Upstream Hashes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Validation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils appstream-util python3

      - name: Validate Metadata
        run: bash scripts/validate/validate-metadata.sh

      - name: Test Auto-Update Pipeline
        run: bash scripts/test/test-auto-update.sh

      - name: Test Build & Install Contracts
        run: bash scripts/test/test-build-and-install.sh

      - name: Test Main Head Guard
        run: bash scripts/test/test-main-head-guard.sh

      - name: Test Workflow Safety
        run: bash scripts/test/test-workflow-safety.sh

      - name: Test Pages Deployment
        run: bash scripts/test/test-deploy-pages.sh

      - name: Test Checksum Verifier
        run: bash scripts/test/test-verify-checksums.sh

      - name: Test Dependabot Auto-Merge
        run: bash scripts/test/test-auto-merge-dependabot.sh

      - name: Test Pipeline Failure Reporting
        run: bash scripts/test/test-report-pipeline-outcome.sh

      - name: Verify Upstream Release Checksums
        run: python3 scripts/validate/verify-checksums.py

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Flatpak & Create Bundle
        run: bash scripts/build/build-flatpak.sh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Upload Flatpak Bundle Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io.filen.desktop-x86_64.flatpak
          path: io.filen.desktop-x86_64.flatpak
          retention-days: 14

      - name: Upload OSTree Repository Archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostree-repo-x86_64
          path: repo.tar.gz
          retention-days: 14

  test-bundle-install:
    name: Test Standalone Bundle Install & Launch
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download Flatpak Bundle Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: io.filen.desktop-x86_64.flatpak

      - name: Install & Launch Bundle
        run: bash scripts/test/test-bundle-install.sh io.filen.desktop-x86_64.flatpak

  test-repo-install:
    name: Test OSTree Repository Install & Update
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download OSTree Repository Archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostree-repo-x86_64

      - name: Add Repository, Install, Launch & Update
        run: bash scripts/test/test-repo-install.sh

  deploy-pages:
    name: Deploy OSTree Repository to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, test-bundle-install, test-repo-install]
    # workflow_dispatch is how an auto-update release reaches Pages: the
    # auto-updater pushes with GITHUB_TOKEN, and such pushes start no workflows.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download OSTree Repository Archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostree-repo-x86_64

      - name: Prepare GitHub Pages Static Site
        run: bash scripts/actions/prepare-pages.sh _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

      # deploy-pages v5 resolves the artifact through the artifact service,
      # which lags the upload and intermittently reports 'No artifacts named
      # "github-pages"'. This drives the Pages deployment API directly.
      - name: Deploy to GitHub Pages
        id: deployment
        run: bash scripts/actions/deploy-pages.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

