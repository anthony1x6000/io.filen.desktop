name: Build & Validate Flatpak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Validation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils appstream-util

      - name: Validate Desktop File
        run: |
          desktop-file-validate io.filen.desktop.desktop

      - name: Validate AppStream Metainfo
        run: |
          appstream-util validate-relax io.filen.desktop.metainfo.xml
          appstreamcli validate --no-net io.filen.desktop.metainfo.xml || true

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.filen.desktop-${{ matrix.arch }}.flatpak
          manifest-path: io.filen.desktop.yaml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}

      - name: Upload Flatpak Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: io.filen.desktop-${{ matrix.arch }}.flatpak
          path: io.filen.desktop-${{ matrix.arch }}.flatpak
          retention-days: 14
