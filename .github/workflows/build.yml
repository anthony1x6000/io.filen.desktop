name: Build & Validate Flatpak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Default deny all token permissions
permissions: {}

jobs:
  validate:
    name: Validate Metadata & Upstream Hashes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Validation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils appstream-util python3

      - name: Validate Metadata
        run: bash scripts/validate-metadata.sh

      - name: Verify Upstream Release Checksums
        run: python3 scripts/verify-checksums.py

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Flatpak & Create Bundle
        run: bash scripts/build-flatpak.sh

      - name: Upload Flatpak Bundle Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: io.filen.desktop-x86_64.flatpak
          path: io.filen.desktop-x86_64.flatpak
          retention-days: 14

      - name: Upload OSTree Repository Archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ostree-repo-x86_64
          path: repo.tar.gz
          retention-days: 14

  test-bundle-install:
    name: Test Standalone Bundle Install & Update
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Download Flatpak Bundle Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: io.filen.desktop-x86_64.flatpak

      - name: Install, Launch & Update Bundle
        run: bash scripts/test-bundle-install.sh io.filen.desktop-x86_64.flatpak

  test-repo-install:
    name: Test OSTree Repository Install & Update
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Download OSTree Repository Archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ostree-repo-x86_64

      - name: Add Repository, Install, Launch & Update
        run: bash scripts/test-repo-install.sh

  deploy-pages:
    name: Deploy OSTree Repository to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, test-bundle-install, test-repo-install]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Download OSTree Repository Archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ostree-repo-x86_64

      - name: Prepare GitHub Pages Static Site
        run: bash scripts/prepare-pages.sh _site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
