name: Build & Validate Flatpak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Default deny all token permissions
permissions: {}

jobs:
  validate:
    name: Validate Metadata & Upstream Hashes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Validation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils appstream-util python3

      - name: Validate Metadata
        run: bash scripts/validate-metadata.sh

      - name: Verify Upstream Release Checksums
        run: python3 scripts/verify-checksums.py

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Flatpak & Create Bundle
        run: bash scripts/build-flatpak.sh

      - name: Upload Flatpak Bundle Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: io.filen.desktop-x86_64.flatpak
          path: io.filen.desktop-x86_64.flatpak
          retention-days: 14

  test-bundle-install:
    name: Test Standalone Bundle Install & Launch
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download Flatpak Bundle Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: io.filen.desktop-x86_64.flatpak

      - name: Install & Launch Bundle
        run: bash scripts/test-bundle-install.sh io.filen.desktop-x86_64.flatpak
