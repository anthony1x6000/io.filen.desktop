app-id: io.filen.desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: filen
separate-locales: false

finish-args:
  # Network access for cloud synchronization, WebDAV, S3, and API communication
  - --share=network
  # IPC socket for X11/Wayland/Chromium communication
  - --share=ipc
  # Display servers (Wayland with fallback to X11)
  - --socket=wayland
  - --socket=fallback-x11
  # Audio support
  - --socket=pulseaudio
  # Hardware acceleration
  - --device=dri
  # Filesystem access for user folder synchronization across local storage
  - --filesystem=host
  # Credential storage via Freedesktop Secret Service & KDE KWallet
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # System tray & Unity progress bar / badge integration
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.AppMenu.Registrar.*
  - --talk-name=com.canonical.Unity
  # Wayland cursor scaling & Trash handling
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=ELECTRON_TRASH=gio

modules:
  - name: filen
    buildsystem: simple
    build-commands:
      # Install launcher and helper binaries
      - install -Dm755 filen.sh /app/bin/filen
      - install -Dm755 apply_extra /app/bin/apply_extra
      - cp /usr/bin/ar /app/bin/
      
      # Install configuration defaults
      - install -Dm644 filen-directories.conf -t /app/etc/
      
      # Install checksum reference files
      - install -Dm644 Filen_linux_amd64.deb.sha256.txt -t /app/etc/checksums/ 2>/dev/null || true
      - install -Dm644 Filen_linux_arm64.deb.sha256.txt -t /app/etc/checksums/ 2>/dev/null || true
      
      # Install XDG Desktop entry and AppStream metadata
      - install -Dm644 io.filen.desktop.desktop -t /app/share/applications/
      - install -Dm644 io.filen.desktop.metainfo.xml -t /app/share/metainfo/
      
      # Install application icons
      - install -Dm644 16x16.png /app/share/icons/hicolor/16x16/apps/io.filen.desktop.png
      - install -Dm644 24x24.png /app/share/icons/hicolor/24x24/apps/io.filen.desktop.png
      - install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/io.filen.desktop.png
      - install -Dm644 48x48.png /app/share/icons/hicolor/48x48/apps/io.filen.desktop.png
      - install -Dm644 64x64.png /app/share/icons/hicolor/64x64/apps/io.filen.desktop.png
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/io.filen.desktop.png
      - install -Dm644 256x256.png /app/share/icons/hicolor/256x256/apps/io.filen.desktop.png
      - install -Dm644 512x512.png /app/share/icons/hicolor/512x512/apps/io.filen.desktop.png
      - install -Dm644 1024x1024.png /app/share/icons/hicolor/1024x1024/apps/io.filen.desktop.png
      
      - mkdir -p /app/main /app/extra

    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          # Verify deb SHA256 against upstream release hash
          - |
            echo "[apply_extra] Verifying debian package checksum against release hash..."
            if [ -f /app/etc/checksums/Filen_linux_amd64.deb.sha256.txt ]; then
              EXPECTED_HASH=$(awk '{print $1}' /app/etc/checksums/Filen_linux_amd64.deb.sha256.txt)
              echo "${EXPECTED_HASH}  filen.deb" | sha256sum -c -
            elif [ -f /app/etc/checksums/Filen_linux_arm64.deb.sha256.txt ]; then
              EXPECTED_HASH=$(awk '{print $1}' /app/etc/checksums/Filen_linux_arm64.deb.sha256.txt)
              echo "${EXPECTED_HASH}  filen.deb" | sha256sum -c -
            elif [ -f Filen_linux_amd64.deb.sha256.txt ]; then
              EXPECTED_HASH=$(awk '{print $1}' Filen_linux_amd64.deb.sha256.txt)
              echo "${EXPECTED_HASH}  filen.deb" | sha256sum -c -
            elif [ -f Filen_linux_arm64.deb.sha256.txt ]; then
              EXPECTED_HASH=$(awk '{print $1}' Filen_linux_arm64.deb.sha256.txt)
              echo "${EXPECTED_HASH}  filen.deb" | sha256sum -c -
            fi
            echo "[apply_extra] Checksum verified. Extracting debian package..."
          - ar x filen.deb
          - tar xf data.tar.*
          - |
            if [ -d opt/Filen ]; then
              mv opt/Filen/* /app/main/
            elif [ -d usr/lib/filen ]; then
              mv usr/lib/filen/* /app/main/
            elif [ -d opt/filen ]; then
              mv opt/filen/* /app/main/
            fi
          - rm -rf filen.deb control.tar.* data.tar.* debian-binary usr opt
          - patch-desktop-filename /app/main/resources/app.asar 2>/dev/null || true

      - type: file
        path: filen.sh

      - type: file
        path: filen-directories.conf

      - type: file
        path: io.filen.desktop.desktop

      - type: file
        path: io.filen.desktop.metainfo.xml

      - type: file
        path: icons/16x16.png

      - type: file
        path: icons/24x24.png

      - type: file
        path: icons/32x32.png

      - type: file
        path: icons/48x48.png

      - type: file
        path: icons/64x64.png

      - type: file
        path: icons/128x128.png

      - type: file
        path: icons/256x256.png

      - type: file
        path: icons/512x512.png

      - type: file
        path: icons/1024x1024.png

      # Upstream SHA256 checksum files
      - type: file
        url: https://github.com/FilenCloudDienste/filen-desktop/releases/download/v3.0.53/Filen_linux_amd64.deb.sha256.txt
        sha256: 9a3010db765a1406081b63c7c054960ee5a9eeec47b8765f18d671dfd78521d0
        only-arches: [x86_64]

      - type: file
        url: https://github.com/FilenCloudDienste/filen-desktop/releases/download/v3.0.53/Filen_linux_arm64.deb.sha256.txt
        sha256: 833a43c9b883c10cc87f04fa4158e16e8c8676309b0a704ac151b4e0b9ab6023
        only-arches: [aarch64]

      # x86_64 binary release source (deb)
      - type: extra-data
        filename: filen.deb
        only-arches: [x86_64]
        url: https://github.com/FilenCloudDienste/filen-desktop/releases/download/v3.0.53/Filen_linux_amd64.deb
        sha256: 2c22f9ab466be753824a784e9c63e7d4b48a7e25f1d641ba6304415c35c6ce04
        size: 284164096
        x-checker-data:
          type: json
          url: https://api.github.com/repos/FilenCloudDienste/filen-desktop/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/FilenCloudDienste/filen-desktop/releases/download/v" + $version + "/Filen_linux_amd64.deb"'
          is-main-source: true

      # aarch64 binary release source (deb)
      - type: extra-data
        filename: filen.deb
        only-arches: [aarch64]
        url: https://github.com/FilenCloudDienste/filen-desktop/releases/download/v3.0.53/Filen_linux_arm64.deb
        sha256: 4a5feed506939d8c9b841473920514b9d900d66c743f43a7a0e984fcc41029d9
        size: 277872640
        x-checker-data:
          type: json
          url: https://api.github.com/repos/FilenCloudDienste/filen-desktop/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/FilenCloudDienste/filen-desktop/releases/download/v" + $version + "/Filen_linux_arm64.deb"'
